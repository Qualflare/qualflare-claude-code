name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qualflare-ai

      # check-slugs.sh expects qualflare-cli as a sibling of qualflare-ai
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: qualflare/qualflare-cli
          path: qualflare-cli

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: "1.23"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Check framework slug sync
        working-directory: qualflare-ai
        run: bash scripts/check-slugs.sh

      - name: Run hook tests
        working-directory: qualflare-ai
        run: node --test hooks/stop-hook.test.mjs

      - name: Install qf CLI
        working-directory: qualflare-cli
        run: |
          go build -o /usr/local/bin/qf ./cmd/main.go

      - name: Smoke-test qf CLI
        working-directory: qualflare-ai
        run: |
          qf version
          qf list-formats

      - name: Verify slug parity against live CLI
        working-directory: qualflare-ai
        run: |
          # Extract slugs from `qf list-formats` output (strip leading whitespace, skip category lines)
          cli_slugs=$(qf list-formats | grep -E '^\s+[a-z]' | awk '{print $1}' | sort)
          # Extract slugs from framework-slugs.md (backtick-quoted entries in the table)
          doc_slugs=$(grep -oE '`[a-z][a-z0-9]+`' skills/qf-init/references/framework-slugs.md | tr -d '`' | sort -u)
          missing_in_docs=$(comm -23 <(echo "$cli_slugs") <(echo "$doc_slugs"))
          missing_in_cli=$(comm -13 <(echo "$cli_slugs") <(echo "$doc_slugs"))
          fail=0
          if [[ -n "$missing_in_docs" ]]; then
            echo "ERROR: CLI slug(s) missing from framework-slugs.md:" >&2
            echo "$missing_in_docs" | sed 's/^/  - /' >&2
            fail=1
          fi
          if [[ -n "$missing_in_cli" ]]; then
            echo "WARNING: doc slug(s) not found in qf list-formats (may be renamed):" >&2
            echo "$missing_in_cli" | sed 's/^/  - /' >&2
          fi
          exit $fail
