name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check framework slug sync
        run: bash scripts/check-slugs.sh

      - name: Run hook tests
        run: node --test hooks/stop-hook.test.mjs
